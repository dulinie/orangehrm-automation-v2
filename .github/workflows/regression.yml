name: OrangeHRM Parallel Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  automation-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Verify Java & Maven
        run: |
          java -version
          mvn -v
          echo "Working directory: $(pwd)"
        shell: bash

      - name: Execute Parallel Test Suite
        run: mvn -B clean test -Denv=qa -Dheadless=true


#      # publish JUnit annotations in the PR
#      - name: Publish test report (annotations)
#        uses: dorny/test-reporter@v1
#        if: always()
#        with:
#           name: OrangeHRM Automation
#           path: target/surefire-reports/TEST-*.xml
#           reporter: junit
#           fail-on-error: false

      - name: Archive Test Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Execution-Reports
          path: target/automation-reports/latest-run/
          retention-days: 7
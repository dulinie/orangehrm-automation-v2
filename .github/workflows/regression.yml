name: OrangeHRM Parallel Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  automation-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your test automation code using the secure release branch
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Environment using the secure release branch
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Securely Cache Maven dependencies using the newest verified tag
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Run your TestNG suite concurrently against the public demo site
      - name: Execute Parallel Test Suite
        run: mvn clean test -Denv=qa -Dheadless=true

      # 5. Save your Extent Report using the newest verified tag
      - name: Archive Test Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Execution-Reports
          path: automation-reports/
          retention-days: 14

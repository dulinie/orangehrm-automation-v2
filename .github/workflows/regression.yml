name: OrangeHRM Parallel Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  automation-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Swapped to @v4 to automatically fetch the latest Node 24 compatible patch
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Environment using v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Swapped to @v4 to clear old caching framework logs
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Run your TestNG suite concurrently
      - name: Execute Parallel Test Suite
        run: mvn clean test -Denv=qa -Dheadless=true || true

      # 5. Swapped to @v4 to cleanly export reports
      - name: Archive Test Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Execution-Reports
          path: target/automation-reports/latest-run/
          retention-days: 7

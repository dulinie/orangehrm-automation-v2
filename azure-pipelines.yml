# 1. Triggers map directly from GitHub 'on: push' and 'pull_request'
trigger:
  - main
  - master

pr:
  - main
  - master

# 2. Virtual Machine environment matches 'runs-on: ubuntu-latest'
pool:
  vmImage: 'ubuntu-latest'

steps:
  # 3. Checkout code is implicit in Azure Pipelines, no action needed!

  # 4. Set up Java Environment (Matches actions/setup-java@v5)
  - task: JavaToolInstaller@0
    displayName: 'Set up JDK 25'
    inputs:
      versionSpec: '25'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # 5. Run TestNG Suite and auto-cache dependencies (Matches Maven execution + caching)
  - task: Maven@4
    displayName: 'Execute Parallel Test Suite'
    continueOnError: true # Matches the '|| true' flag from your GitHub action script
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean test'
      options: '-Denv=qa -Dheadless=true'
      optionsCacheEnabled: true
      publishJUnitResults: false

    # 5b. Publish Results directly to the Parent Test Plan
  - task: PublishTestResults@2
    displayName: 'Sync Results to Free Month Test Plan'
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      mergeTestResults: true
      # --- TRACE TRHOUGH ROOT PLAN ---
      testRunTitle: 'Automated Module Execution'
      testPlanId: '9'
      testSuiteId: '10'
      testConfiguration: 'Windows 10'


  # 6. Archive Execution Reports (Matches actions/upload-artifact@v4)
  - task: PublishBuildArtifacts@1
    displayName: 'Archive Test Execution Reports'
    condition: always()
    inputs:
      PathtoPublish: 'target/automation-reports/latest-run/'
      ArtifactName: 'Automation-Execution-Reports'
      publishLocation: 'Container'
